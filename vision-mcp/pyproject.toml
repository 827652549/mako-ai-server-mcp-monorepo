[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-mcp"
version = "1.0.0"
description = "视觉分析 MCP Server — 为无多模态能力的模型提供视觉工具箱"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mako"}]
keywords = ["fastapi", "mcp", "vision", "anthropic", "multimodal"]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "mcp>=1.0.0",
    "httpx[socks]>=0.25.0",
    "anthropic>=0.40.0",
    "structlog>=23.2.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "prometheus-client>=0.19.0",
    "tenacity>=8.2.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["logs*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
